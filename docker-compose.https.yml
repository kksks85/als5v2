services:
  web:
    ports:
      - "${APP_HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH to the PEM certificate file}:/etc/nginx/tls/als50.crt:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH to the PEM private key file}:/etc/nginx/tls/als50.key:ro