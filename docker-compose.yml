services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-als50}
      POSTGRES_USER: ${POSTGRES_USER:-als50}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-development-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-development-password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-als50}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-als50}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_API_SCOPE: ${ENTRA_API_SCOPE:-}
      # Fix #1: Require JWT secret to be set - no defaults allowed
      AUTH_JWT_SECRET: '${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in .env (generate with: python -c "import secrets; print(secrets.token_urlsafe(64))")}'
      # Fix #9: Rate limiting with Redis backend
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis-development-password}@redis:6379/0}
      LDAP_SERVER_URI: ${LDAP_SERVER_URI:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_DN_TEMPLATE: ${LDAP_USER_DN_TEMPLATE:-{username}@{domain}}
      LDAP_USER_DOMAIN: ${LDAP_USER_DOMAIN:-}
      AD_SSO_PROXY_ENABLED: ${AD_SSO_PROXY_ENABLED:-false}
      AD_TRUSTED_IDENTITY_HEADER: ${AD_TRUSTED_IDENTITY_HEADER:-X-Remote-User}
      # Fix #6: Require admin credentials to be set
      UAT_LOCAL_ADMIN_USERNAME: ${UAT_LOCAL_ADMIN_USERNAME:-admin}
      UAT_LOCAL_ADMIN_PASSWORD: ${UAT_LOCAL_ADMIN_PASSWORD:?Set UAT_LOCAL_ADMIN_PASSWORD in .env}
      UAT_LOCAL_ADMIN_EMAIL: ${UAT_LOCAL_ADMIN_EMAIL:-admin@als50.local}
      # Fix #7: Remove demo password to disable demo login
      UAT_DEMO_PASSWORD: ${UAT_DEMO_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Aerofix Service}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
